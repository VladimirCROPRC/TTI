name: Validate TTI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check backend/worker.mjs
      - run: node backend/test-vpn.mjs
      - run: node --check dist/creation.js
      - run: node backend/test-photo-location.mjs
      - run: node backend/test-photo-groups.mjs
      - run: node --check dist/pwa.js
      - run: node backend/test-pwa.mjs
      - run: node --check dist/point-merge.js
      - run: node --check backend/point-merge.mjs
      - run: node --check dist/kmz-export.js
      - run: node backend/test-kmz-export.mjs
